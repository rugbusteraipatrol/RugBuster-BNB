<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Try the checkout — BasePay</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        padding: 32px 16px;
        font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f5f7fb;
        color: #0b0d12;
      }
      /* minmax(0, 1fr) rather than 1fr: a grid track's default min size is
         min-content, which the <pre> block below would push past the page. */
      main {
        max-width: 980px; margin: 0 auto; display: grid; gap: 24px;
        grid-template-columns: minmax(0, 1fr);
      }
      @media (min-width: 860px) {
        main { grid-template-columns: minmax(0, 1fr) 420px; align-items: start; }
      }
      .panel { background: #fff; border: 1px solid #e3e7ee; border-radius: 14px; padding: 20px; min-width: 0; }
      .back { display: inline-block; font-size: 14px; color: #0052ff; text-decoration: none; margin-bottom: 14px; }
      h1 { font-size: 24px; margin: 0 0 8px; }
      h2 { font-size: 15px; margin: 24px 0 8px; text-transform: uppercase; letter-spacing: .06em; color: #5b6472; }
      p { margin: 0 0 12px; color: #3b4453; }
      a { color: #0052ff; }
      .notice {
        border-left: 3px solid #0052ff; background: #eef3ff; color: #3b4453;
        border-radius: 0 10px 10px 0; padding: 10px 14px; margin: 0 0 16px; font-size: 15px;
      }
      button {
        font: inherit; font-weight: 600; cursor: pointer; width: 100%;
        padding: 12px 16px; border-radius: 10px; border: 1px solid #0052ff;
        background: #0052ff; color: #fff;
      }
      button:focus-visible, a:focus-visible { outline: 3px solid #0052ff; outline-offset: 2px; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
      pre {
        background: #0b0d12; color: #e6ebf5; padding: 12px; border-radius: 10px;
        overflow-x: auto; font-size: 12.5px; margin: 0 0 12px;
      }
      #log { font-size: 13px; color: #5b6472; margin-top: 12px; min-height: 1.5em; }
      @media (prefers-color-scheme: dark) {
        body { background: #0e1014; color: #f2f4f8; }
        .panel { background: #14161c; border-color: #2a2f3a; }
        p, h2, #log { color: #9aa4b5; }
        .notice { background: #151b2b; color: #c5cbd6; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <a class="back" href="/">← BasePay</a>
        <h1>Try the checkout</h1>
        <p>
          This is the checkout your customers see on your site: the price, the exact
          USDC amount, your wallet address and a QR code to scan with a phone.
        </p>

        <p class="notice" id="network" hidden></p>

        <button id="checkout" type="button">Open the checkout</button>
        <p id="log" role="status" aria-live="polite"></p>

        <h2>Put it on your site</h2>
        <p>One element and one script tag, anywhere you can paste HTML:</p>
        <pre><code id="snippet"></code></pre>
        <p><a href="/#start">How setup works</a></p>
      </section>

      <section class="panel">
        <div id="basepay"></div>
      </section>
    </main>

    <script src="/widget/widget.js" data-auto="false"></script>
    <script>
      // The defaults are what a visitor sees. Local development can override them,
      // e.g. /demo/?amount=45.00 against the dev chain.
      const params = new URLSearchParams(location.search);
      const merchantId = params.get('merchant') || 'demo';
      const amountUsd = params.get('amount') || '0.01';

      const log = document.getElementById('log');
      const mountPoint = document.getElementById('basepay');
      const button = document.getElementById('checkout');
      button.textContent = `Open a $${amountUsd} checkout`;

      document.getElementById('snippet').textContent = [
        '<div id="checkout"></div>',
        '<script',
        `  src="${location.origin}/widget/widget.js"`,
        '  data-merchant="your-store"',
        '  data-amount-usd="45.00"',
        '  data-order-ref="ORDER-1001"',
        '  data-target="#checkout"></' + 'script>',
      ].join('\n');

      // Say plainly whether paying is real. On Base mainnet it is.
      fetch('/healthz')
        .then((response) => response.json())
        .then(({ chainId }) => {
          const notice = document.getElementById('network');
          notice.textContent =
            chainId === 8453
              ? `This checkout is live on Base. You do not have to pay to try it, but if you do, it is real: $${amountUsd} in USDC goes to BasePay's wallet, and your wallet adds a network fee of about a cent.`
              : `Connected to a test chain (chain ID ${chainId}). Nothing here is real money; pay it with npm run dev:pay, as the README describes.`;
          notice.hidden = false;
        })
        .catch(() => undefined);

      let widget = null;
      button.addEventListener('click', () => {
        widget?.destroy();
        mountPoint.replaceChildren();
        log.textContent = 'Opening a payment session…';

        widget = window.BasePay.mount({
          merchantId,
          amountUsd,
          orderRef: 'DEMO',
          target: mountPoint,
          explorerBaseUrl: window.DEMO_EXPLORER || 'https://basescan.org',
        });
      });

      // The widget announces terminal states on its host element.
      mountPoint.addEventListener('basepay:settled', (event) => {
        log.textContent = `Session ${event.detail.sessionId} finished as "${event.detail.status}".`;
      });
    </script>
  </body>
</html>
