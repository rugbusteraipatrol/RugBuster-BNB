<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Payment — StableCart</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --ink: #1d1d1f; --ink-2: #6e6e73; --line: #d2d2d7; --accent: #4f6ef7;
        --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; background: #f5f5f7; color: var(--ink);
        font: 17px/1.47 var(--sans); letter-spacing: -0.012em; -webkit-font-smoothing: antialiased;
        display: flex; flex-direction: column; align-items: center; padding: 28px 16px 40px;
      }
      a { color: var(--accent); text-decoration: none; }
      .wordmark { font-weight: 700; letter-spacing: -0.045em; color: var(--ink); font-size: 17px; }
      .wordmark i { display: inline-block; width: .2em; height: .2em; border-radius: 50%; background: linear-gradient(135deg, #6d5dfc, #3b82f6 55%, #22d3ee); margin-left: .045em; vertical-align: baseline; }
      main { width: 100%; max-width: 440px; }
      .card { background: #fff; border-radius: 22px; padding: 22px; box-shadow: 0 20px 50px -30px rgba(29,29,31,.4); }
      .head { text-align: center; margin: 22px 0 18px; }
      .title { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 4px; word-break: break-word; }
      .to { font-size: 14px; color: var(--ink-2); margin: 0; }
      .notice { margin: 0 0 14px; font-size: 15px; color: var(--ink-2); }
      .err { background: #fff; border-radius: 22px; padding: 24px; text-align: center; }
      .err h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: -0.02em; }
      .foot { text-align: center; font-size: 12.5px; color: var(--ink-2); margin-top: 22px; line-height: 1.5; }
      .paid { display: none; text-align: center; padding: 10px 0 4px; }
      .paid.show { display: block; }
      .paid .tick { width: 54px; height: 54px; border-radius: 50%; background: #30d158; display: inline-grid; place-items: center; margin-bottom: 12px; }
      .paid .tick svg { width: 28px; height: 28px; stroke: #fff; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .paid strong { display: block; font-size: 20px; letter-spacing: -0.02em; }
      .paid span { color: var(--ink-2); font-size: 15px; }
    </style>
  </head>
  <body>
    <a class="wordmark" href="/">stablecart<i></i></a>
    <main>
      <div class="head" id="head" hidden>
        <p class="title" id="title"></p>
        <p class="to" id="to"></p>
      </div>
      <div id="slot"></div>
      <div class="card paid" id="paid">
        <span class="tick"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4 4L19 7" /></svg></span>
        <strong>Paid</strong>
        <span id="paid-note">Thank you. Show this screen to the seller if they ask.</span>
      </div>
      <div class="err" id="err" hidden>
        <h1>This payment link is not valid</h1>
        <p class="notice" id="err-msg">Ask the seller for a new one.</p>
        <a href="/">What is StableCart?</a>
      </div>
      <p class="foot">
        You pay USDC on Base directly to the seller's wallet.<br />
        StableCart never holds the money and cannot reverse a payment.
      </p>
    </main>

    <script src="/widget/widget.js" data-auto="false"></script>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var merchant = (params.get('m') || '').trim();
        var amount = (params.get('a') || '').trim();
        var reference = (params.get('r') || '').trim();
        var title = (params.get('t') || '').trim().slice(0, 120);
        var locale = (params.get('l') || '').trim();

        var fail = function (message) {
          document.getElementById('err').hidden = false;
          if (message) document.getElementById('err-msg').textContent = message;
        };

        if (!/^[a-zA-Z0-9._-]{1,128}$/.test(merchant)) return fail('The link is missing the seller.');
        if (!/^\d{1,9}(\.\d{1,2})?$/.test(amount) || Number(amount) <= 0) return fail('The link is missing a valid amount.');
        if (reference && !/^[\w .\/-]{1,64}$/.test(reference)) return fail('The link has an invalid reference.');

        var head = document.getElementById('head');
        document.getElementById('title').textContent = title || 'Payment';
        document.getElementById('to').textContent = reference ? 'Reference ' + reference : 'to ' + merchant;
        head.hidden = false;

        var slot = document.getElementById('slot');
        window.StableCart.mount({
          merchantId: merchant,
          amountUsd: amount,
          orderRef: reference || null,
          target: slot,
          locale: locale,
        });

        slot.addEventListener('stablecart:settled', function (event) {
          if (!event.detail || event.detail.status !== 'paid') return;
          var note = title ? title + ' · $' + amount : '$' + amount;
          document.getElementById('paid-note').textContent =
            note + ' received. Thank you. Show this screen to the seller if they ask.';
          document.getElementById('paid').classList.add('show');
        });
      })();
    </script>
  </body>
</html>
